<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=Cairo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CompanySystem</title>
    <!-- Apply the saved theme + language before first paint (no flash of the wrong theme) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cs_theme');
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
          var l = localStorage.getItem('cs_lang');
          if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
